# ============================================================
#  LaCasaDelPanApp — Plantilla de configuración
#
#  En el primer arranque la aplicación copia este archivo como
#  config.ini dentro de su carpeta de datos:
#    * Desarrollo:       <proyecto>\config\config.ini
#    * .exe empaquetado: %PROGRAMDATA%\LaCasaDelPanApp\config\config.ini
#  Edita el config.ini de esa carpeta con los datos reales.
# ============================================================

[db]
# Ruta al archivo SQLite (relativa a la carpeta de datos o absoluta)
archivo = db/lacasadepan.db

[negocio]
# Identificador de la caja física (1 = caja principal)
caja_id = 1

# Datos del EMISOR que se muestran en la BOLETA / FACTURA (cabecera).
# Escribe aquí los datos reales del negocio (tal como figuran en la Ficha RUC).
razon_social = LA CASA DEL PAN S.A.C.
nombre_comercial = LA CASA DEL PAN
ruc = 20603122144
direccion = AV. NICOLAS AYLLON NRO. 1502 URB. CHACLACAYO
ubigeo = 150107
telefono =

# ============================================================
#  Emisión electrónica directa a SUNAT (Opción B: sin Java/SFS)
# ============================================================
[sunat]
# Interruptor maestro: si es false, la app NO genera ni envía XML.
habilitado = true
# beta = WS Beta (pruebas; usa 20603122144MODDATOS / MODDATOS)
# produccion = WS real (requiere credenciales SOL reales)
entorno = beta
# Certificado digital (.pfx) para firmar el XML
# (ruta relativa a la carpeta de datos o absoluta).
# En beta, si no existe, se genera uno autofirmado de prueba la primera vez.
cert_path = config/certificado_prueba.pfx
cert_pass = test123
# Credenciales SOL.
usuario_sol = 20603122144MODDATOS
clave_sol = MODDATOS

[impresora]
# escpos = USB directo (python-escpos) | driver = cola de impresión Windows
tipo = driver
ancho = 80
nombre = POS-80

[ui]
tema = light
bloqueo_inactividad_min = 5
